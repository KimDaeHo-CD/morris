<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MORRIS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <!-- <link rel="stylesheet" href="../css/"> -->
  </head>
  <body>
    <header class="header">
      <h1 class="logo">
        <a href=""><img src="../images/common/logo.png" alt="" /></a>
      </h1>
      <nav class="gnb">
        <ul class="list">
          <li>
            <a href="">상품소개</a>
          </li>
          <li>
            <a href="">회사소개</a>
          </li>
          <li>
            <a href="">연구개발</a>
          </li>
          <li>
            <a href="">홍보센터</a>
          </li>
          <li>
            <a href="">문의하기</a>
          </li>
        </ul>
      </nav>
    </header>
    <!-- header-end -->
    <div class="right">
      <div class="logo2">
        <img src="../images/common/floating_logo.svg" alt="" />
      </div>
      <div class="right-txt">
        <p class="t1">온라인 스토어</p>
        <p class="t2">바로가기</p>
        <p class="t3">대량구매 문의</p>
      </div>
    </div>
    <div class="main-visual">
      <ul class="swiper-wrapper visual-list">
        <li class="swiper-slide visual01">
          <img src="../images/main/visual01.jpg" alt="" />
        </li>
        <li class="swiper-slide visual02">
          <img src="../images/main/visual02.jpg" alt="" />
        </li>
        <li class="swiper-slide visual03">
          <img src="../images/main/visual03.jpg" alt="" />
        </li>
        <li class="swiper-slide visual04">
          <img src="../images/main/visual04.jpg" alt="" />
        </li>
      </ul>
      <div class="pagination"></div>
    </div>
  </body>
  <script>
    const customBullets = [
      `
       <div class="txt">
         <span class="no">01</span>
          <p class="title">Prime Glitter Highlighter S</p>
          <p class="desc">steady in hand 모리스는 일상의 순간을 이어주는
         문구를 만듭니다.
         생각과 감정의 흐름이 끊기지 않도록,
         더 나은 경험을 제안합니다. </p>
          <span class="btn">finf out</span>
       </div>
        <div class="line"></div>
        `,
      `
         <div class="txt">
           <span class="no">02</span>
                   <p class="title">Prime Glitter Highlighter S</p>
                   <p class="desc">steady in hand</p>
                   <span class="btn">finf out</span>
         </div>
        <div class="line"></div>
        `,
      `
         <div class="txt">
           <span class="no">03</span>
                   <p class="title">Prime Glitter Highlighter S</p>
                   <p class="desc">steady in hand</p>
                   <span class="btn">finf out</span>
         </div>
        <div class="line"></div>
        `,
      `
         <div class="txt">
           <span class="no">04</span>
                   <p class="title">Prime Glitter Highlighter S</p>
                   <p class="desc">steady in hand</p>
                   <span class="btn">finf out</span>
         </div>
        <div class="line"></div>
        `,
    ];
    const swiper = new Swiper(".main-visual", {
      loop: true,
      speed: 1000,
      effect: "coverflow",
      autoplay: {
        delay: 2000,
        disableOnInteraction: false,
      },
      speed: 2000,
      loop: true,
      pagination: {
        el: ".main-visual .pagination",
        clickable: true,
        renderBullet: function (index, className) {
          return `<div class="${className}">${customBullets[index]}</div>`;
        },
      },
    });
  </script>
</html>
